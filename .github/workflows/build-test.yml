name: Compilar y probar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar
        run: dotnet restore Coophead.sln
      - name: Compilar Core (net35 y netstandard2.0) y plugin (net35)
        run: dotnet build Coophead.sln -c Release --no-restore
      - name: Pruebas unitarias
        run: dotnet test Coophead.sln -c Release --no-build --verbosity normal
      - name: Empaquetar plugin (no probado en el juego)
        run: |
          mkdir -p artifacts/BepInEx/plugins/Coophead
          cp src/Coophead.Plugin/bin/Release/net35/Coophead.dll artifacts/BepInEx/plugins/Coophead/
          cp src/Coophead.Core/bin/Release/net35/Coophead.Core.dll artifacts/BepInEx/plugins/Coophead/
      - uses: actions/upload-artifact@v4
        with:
          name: Coophead-plugin-sin-probar
          path: artifacts/
          if-no-files-found: error
